<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | SentinelFlow AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0e17;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .offline-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 450px;
      margin: 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #00f0ff;
      margin: 0 0 0.75rem 0;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      background: #00f0ff;
      color: #0a0e17;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">📡</div>
    <h1>Telemetry Feed Disconnected</h1>
    <p>
      You are currently offline. SentinelFlow AI requires an active network connection to correlate live synthetic events and run AI models.
    </p>
    <button class="btn" onclick="window.location.reload()">Reconnect to Radar</button>
  </div>
</body>
</html>
