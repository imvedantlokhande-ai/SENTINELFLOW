<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Shield Logo -->
  <g transform="translate(140, 200)">
    <path d="M 100 20 L 160 45 C 160 110 135 160 100 185 C 65 160 40 110 40 45 Z" 
          fill="rgba(0, 240, 255, 0.08)" 
          stroke="url(#cyanGrad)" 
          stroke-width="6" 
          filter="url(#glow)" />
    <path d="M 100 50 L 135 68 C 135 115 120 145 100 160 C 80 145 65 115 65 68 Z" 
          fill="rgba(0, 240, 255, 0.15)" 
          stroke="#00f0ff" 
          stroke-width="3" />
    <circle cx="100" cy="105" r="10" fill="#00f0ff" filter="url(#glow)" />
  </g>

  <!-- Title & Branding -->
  <text x="350" y="270" font-family="'Outfit', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">
    SENTINELFLOW <tspan fill="#00f0ff">AI</tspan>
  </text>
  <text x="350" y="330" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" letter-spacing="4">
    AUTONOMOUS INCIDENT INVESTIGATION &amp; RESPONSE
  </text>

  <!-- Feature Highlights -->
  <g transform="translate(350, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="44" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="110" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00f0ff" text-anchor="middle">
      🛡️ AIR-GAPPED SIM
    </text>
    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="44" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="350" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">
      👤 HUMAN-IN-THE-LOOP
    </text>
    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="44" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="590" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">
      🔍 VERIFIED AUDIT
    </text>
  </g>

  <!-- Footer Tagline -->
  <text x="600" y="580" font-family="'Outfit', sans-serif" font-size="16" fill="#64748b" text-anchor="middle">
    Demonstration Security Operations Center • Built Beyond AI with Python &amp; Streamlit
  </text>
</svg>
