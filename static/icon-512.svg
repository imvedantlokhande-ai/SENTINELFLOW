<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="pwaShield512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="pwaGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" fill="url(#pwaBg512)" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing outer shield -->
  <path d="M256 70 L390 125 C390 265 330 380 256 430 C182 380 122 265 122 125 Z" 
        fill="none" 
        stroke="url(#pwaShield512)" 
        stroke-width="12" 
        filter="url(#pwaGlow512)" />

  <!-- Inner solid shield -->
  <path d="M256 102 L360 148 C360 255 312 350 256 394 C200 350 152 255 152 148 Z" 
        fill="rgba(0, 240, 255, 0.12)" 
        stroke="#00f0ff" 
        stroke-width="6" />

  <!-- Core Circuit Node -->
  <circle cx="256" cy="245" r="42" fill="#00f0ff" filter="url(#pwaGlow512)"/>
  <circle cx="256" cy="245" r="22" fill="#ffffff" />

  <!-- Radiating circuit branches -->
  <line x1="256" y1="148" x2="256" y2="203" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="287" x2="256" y2="355" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="195" y1="245" x2="214" y2="245" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="298" y1="245" x2="317" y2="245" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
</svg>
