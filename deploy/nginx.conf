# SentinelFlow AI - Production Nginx Configuration
# Enforces HTTP-to-HTTPS redirection, HSTS, secure cookies, and Streamlit WebSocket proxying.

server {
    listen 80;
    listen [::]:80;
    server_name sentinelflow.ai www.sentinelflow.ai;

    # Canonical redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sentinelflow.ai www.sentinelflow.ai;

    # TLS Certificates (manage via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sentinelflow.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentinelflow.ai/privkey.pem;

    # Hardened TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PWA Service Worker with root scope authorization
    location = /service-worker.js {
        proxy_pass http://127.0.0.1:8501/app/static/service-worker.js;
        add_header Service-Worker-Allowed "/" always;
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "no-cache" always;
    }

    # PWA Web App Manifest
    location = /manifest.json {
        proxy_pass http://127.0.0.1:8501/app/static/manifest.json;
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Proxy to Streamlit
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # Streamlit WebSocket Stream
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}
